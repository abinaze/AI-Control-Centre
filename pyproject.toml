[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-centre"
version = "0.1.0"
description = "A local-first autonomous AI development and control platform."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
    { name = "Abinaze Binoy" }
]
keywords = [
    "ai",
    "agents",
    "automation",
    "developer-tools",
    "local-ai",
    "orchestration",
    "autonomous-agents"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Testing"
]

[project.urls]
Homepage = "https://github.com/abinaze/AI-Control-Centre"
Repository = "https://github.com/abinaze/AI-Control-Centre"
Issues = "https://github.com/abinaze/AI-Control-Centre/issues"

[project.scripts]
aic = "aic_control_centre.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
